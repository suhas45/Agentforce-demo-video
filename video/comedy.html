<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#111}
body{font-family:Inter,"Liberation Sans",sans-serif}
svg{position:absolute;inset:0}
#sub{position:absolute;left:0;right:0;bottom:46px;text-align:center}
#sub .pill{display:inline-block;max-width:1400px;background:rgba(10,14,22,.78);color:#fff;font-weight:700;font-size:40px;
  line-height:1.3;padding:14px 34px 16px;border-radius:18px}
#sub .who{display:block;font-size:19px;letter-spacing:.14em;font-weight:800;margin-bottom:2px}
#chip{position:absolute;left:56px;top:48px;background:rgba(255,255,255,.92);color:#1b2433;font-weight:800;font-size:26px;
  padding:10px 20px;border-radius:12px;letter-spacing:.02em}
#fade{position:absolute;inset:0;background:#000;pointer-events:none}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:#0E1320}
#card h1{font-size:120px;font-weight:800;letter-spacing:-.02em}
#card p{font-size:34px;font-weight:500;color:#9AA7BD;margin-top:18px}
</style></head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
<div id="chip"></div>
<div id="sub"></div>
<div id="card"><h1>The 5-Minute Job</h1><p>Every Friday. Somewhere.</p></div>
<div id="fade"></div>
<script src="../build/comedy/timings.js"></script>
<script>
const W = window.TM, L = W.lines, FPS = 30;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => (k = clamp(k), k * k * (3 - 2 * k));
const ramp = (t, a, b) => ease((t - a) / (b - a));
const env = (who, t) => {
  const e = W.env[who], f = t * FPS, i = Math.floor(f);
  return lerp(e[i] || 0, e[i + 1] || 0, f - i);
};
const blinkAt = (t, seed) => { // natural blinks every ~3-4.5s
  const p = 3.1 + (seed % 7) * 0.23, ph = (t + seed) % p;
  return ph < 0.12 ? Math.sin(ph / 0.12 * Math.PI) : 0;
};
const speaking = (who, t) => L.some(l => l.spk === who && t >= l.start - 0.05 && t <= l.end + 0.05);
const S = (i, d = 0) => L[i].start + d, E = (i, d = 0) => L[i].end + d;

const SKIN_A = '#B9784C', SKIN_M = '#A86A42', SHADE = 'rgba(0,0,0,.12)', INK = '#2A1E1A';

// ---------- heads ----------
function head(o) {
  const skin = o.skin, m = clamp(o.mouth || 0), bl = clamp(o.blink || 0), lx = o.lx || 0, ly = o.ly || 0;
  const worry = o.worry || 0, frown = o.frown || 0;
  let s = '';
  s += `<ellipse cx="-66" cy="8" rx="15" ry="19" fill="${skin}"/><ellipse cx="66" cy="8" rx="15" ry="19" fill="${skin}"/>`;
  s += `<ellipse cx="0" cy="0" rx="66" ry="78" fill="${skin}"/>`;
  s += `<path d="M-60 30 Q0 95 60 30 Q55 80 0 80 Q-55 80 -60 30Z" fill="${SHADE}"/>`;
  if (o.kind === 'arjun') {
    s += `<path d="M-70 -6 Q-80 -70 -30 -88 Q10 -104 50 -86 Q84 -66 72 -4 Q66 -40 44 -52 Q20 -38 -6 -50 Q-30 -36 -52 -46 Q-66 -30 -70 -6Z" fill="#1E1714"/>`;
    s += `<path d="M-30 -88 L-38 -104 L-14 -94 L-4 -110 L10 -96 L30 -106 L34 -90Z" fill="#1E1714"/>`;
  } else {
    s += `<path d="M-70 4 Q-74 -40 -52 -58 Q-56 -30 -60 6Z" fill="#3A3330"/><path d="M70 4 Q74 -40 52 -58 Q56 -30 60 6Z" fill="#3A3330"/>`;
    s += `<path d="M-44 -66 Q0 -84 44 -66 Q20 -74 0 -74 Q-20 -74 -44 -66Z" fill="#3A3330" opacity=".55"/>`;
    s += `<ellipse cx="-20" cy="-58" rx="18" ry="7" fill="#fff" opacity=".18" transform="rotate(-18 -20 -58)"/>`;
  }
  // eyes
  const ey = -4, ry = 12 * (1 - bl) + 0.6;
  for (const ex of [-25, 25]) {
    s += `<ellipse cx="${ex}" cy="${ey}" rx="12" ry="${ry}" fill="#fff"/>`;
    if (bl < 0.8) s += `<circle cx="${ex + lx * 5}" cy="${ey + ly * 4}" r="6" fill="${INK}"/>`;
    if (o.lid) s += `<path d="M${ex - 13} ${ey - 13} H${ex + 13} V${ey - 13 + 24 * o.lid} H${ex - 13}Z" fill="${skin}"/>`;
  }
  // brows
  const bw = o.kind === 'manager' ? 7 : 5;
  s += `<path d="M-40 ${-27 + frown * 4} L-12 ${-27 - worry * 9 + frown * 8}" stroke="${o.kind === 'manager' ? '#2B2422' : '#1E1714'}" stroke-width="${bw}" stroke-linecap="round"/>`;
  s += `<path d="M40 ${-27 + frown * 4} L12 ${-27 - worry * 9 + frown * 8}" stroke="${o.kind === 'manager' ? '#2B2422' : '#1E1714'}" stroke-width="${bw}" stroke-linecap="round"/>`;
  if (o.glasses) s += `<g fill="none" stroke="#22252B" stroke-width="4"><rect x="-43" y="-20" width="36" height="30" rx="9"/><rect x="7" y="-20" width="36" height="30" rx="9"/><path d="M-7 -8 Q0 -13 7 -8"/></g>`;
  if (o.shades) s += `<g transform="translate(0 -62)"><rect x="-44" y="-12" width="38" height="20" rx="8" fill="#1d232c"/><rect x="6" y="-12" width="38" height="20" rx="8" fill="#1d232c"/><path d="M-6 -4 H6" stroke="#1d232c" stroke-width="4"/></g>`;
  if (o.shadesOn) s += `<g><rect x="-45" y="-18" width="40" height="24" rx="9" fill="#151a21"/><rect x="5" y="-18" width="40" height="24" rx="9" fill="#151a21"/><path d="M-5 -8 H5" stroke="#151a21" stroke-width="5"/><path d="M-36 -12 l10 0" stroke="#fff" stroke-opacity=".3" stroke-width="3"/></g>`;
  // nose
  s += `<path d="M2 6 Q10 22 0 26 Q-6 27 -8 24" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="3.5" stroke-linecap="round"/>`;
  // mouth
  const my = o.kind === 'manager' ? 48 : 46;
  if (m > 0.06) s += `<ellipse cx="0" cy="${my}" rx="${13 + m * 5}" ry="${2.5 + m * 14}" fill="#5B1F1C"/><ellipse cx="0" cy="${my + m * 8}" rx="${7 + m * 3}" ry="${m * 5}" fill="#C4605A"/>`;
  else {
    const c = (o.smile || 0) * 6 - (o.sad || 0) * 6;
    s += `<path d="M-14 ${my - c * 0.3} Q0 ${my + c} 14 ${my - c * 0.3}" fill="none" stroke="#5B1F1C" stroke-width="4.5" stroke-linecap="round"/>`;
  }
  if (o.kind === 'manager') s += `<path d="M-34 38 Q-18 24 0 31 Q18 24 34 38 Q20 36 0 38 Q-20 36 -34 38Z" fill="#2B2422"/>`;
  return s;
}

// two-bone arm from shoulder (sx,sy) to hand (hx,hy)
function arm(sx, sy, hx, hy, bend, sleeve, skin, w = 34) {
  const l1 = 105, l2 = 100, dx = hx - sx, dy = hy - sy;
  let d = Math.hypot(dx, dy); const dd = Math.min(d, l1 + l2 - 1);
  const a = Math.atan2(dy, dx), k = Math.acos(clamp((l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd), -1, 1)) * bend;
  const exn = sx + l1 * Math.cos(a + k), eyn = sy + l1 * Math.sin(a + k);
  if (d > l1 + l2) { hx = sx + dx / d * dd; hy = sy + dy / d * dd; }
  return `<path d="M${sx} ${sy} L${exn} ${eyn} L${hx} ${hy}" fill="none" stroke="${sleeve}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<circle cx="${hx}" cy="${hy}" r="17" fill="${skin}"/>`;
}

// ---------- characters (origin = waist centre) ----------
function manager(o) {
  const shirt = '#BFD7EE', tie = '#B23A33', skin = SKIN_M;
  let s = '';
  if (o.legs) {
    const sw = o.walk ? Math.sin(o.walk) * 22 : 0;
    s += `<path d="M-30 0 L${-34 + sw} 250" stroke="#3B3F4A" stroke-width="46" stroke-linecap="round"/><path d="M30 0 L${34 - sw} 250" stroke="#3B3F4A" stroke-width="46" stroke-linecap="round"/>`;
    s += `<ellipse cx="${-30 + sw}" cy="262" rx="36" ry="14" fill="#231d1a"/><ellipse cx="${38 - sw}" cy="262" rx="36" ry="14" fill="#231d1a"/>`;
  }
  s += `<path d="M-78 -230 Q-96 -120 -88 -20 Q-60 12 0 14 Q60 12 88 -20 Q96 -120 78 -230 Q40 -258 0 -258 Q-40 -258 -78 -230Z" fill="${shirt}"/>`;
  s += `<path d="M-88 -20 Q0 20 88 -20 L88 6 Q0 34 -88 6Z" fill="#2E3139"/>`;
  s += `<path d="M-6 -252 L6 -252 L14 -150 L0 -120 L-14 -150Z" fill="${tie}"/><path d="M-12 -258 L12 -258 L8 -240 L-8 -240Z" fill="#8E2C27"/>`;
  s += `<path d="M-30 -258 L0 -236 L30 -258" fill="none" stroke="#9FBCD8" stroke-width="8" stroke-linejoin="round"/>`;
  s += `<path d="M-40 -246 L-46 -150" stroke="#2B5D9A" stroke-width="5"/><rect x="-62" y="-152" width="34" height="44" rx="5" fill="#fff" stroke="#2B5D9A" stroke-width="3"/><rect x="-55" y="-144" width="20" height="14" rx="3" fill="#7FA6D1"/>`;
  s += `<rect x="-20" y="-286" width="40" height="40" fill="${skin}"/>`;
  const sh = 70;
  const L1 = o.armL || [-110, -40], R1 = o.armR || [110, -40];
  if (o.behindL) s = arm(-sh, -224, L1[0], L1[1], o.bendL ?? -1, shirt, skin) + s; else s += arm(-sh, -224, L1[0], L1[1], o.bendL ?? -1, shirt, skin);
  s += arm(sh, -224, R1[0], R1[1], o.bendR ?? 1, shirt, skin);
  if (o.mug) s += `<g transform="translate(${L1[0]} ${L1[1] - 10})"><rect x="-20" y="-30" width="40" height="46" rx="6" fill="#F4F1EA"/><path d="M20 -20 Q36 -10 20 4" fill="none" stroke="#F4F1EA" stroke-width="7"/><text x="0" y="0" font-size="11" font-weight="800" text-anchor="middle" fill="#B23A33">BOSS</text></g>`;
  if (o.juice) s += `<g transform="translate(${L1[0]} ${L1[1] - 18})"><path d="M-17 -34 L17 -34 L12 22 L-12 22Z" fill="#FFF7E8" opacity=".9"/><path d="M-15 -14 L15 -14 L12 20 L-12 20Z" fill="#F2A33A"/><path d="M6 -34 L18 -62" stroke="#E2475A" stroke-width="4"/><circle cx="-12" cy="-36" r="9" fill="#F7D046"/></g>`;
  s += `<g transform="translate(${o.hx || 0} ${-345 + (o.hy || 0)}) rotate(${o.tilt || 0})">${head({ ...o.face, kind: 'manager', skin })}</g>`;
  if (o.phone) s += `<rect x="${R1[0] - 14}" y="${R1[1] - 30}" width="28" height="54" rx="7" fill="#1b1f26" transform="rotate(-10 ${R1[0]} ${R1[1]})"/><circle cx="${R1[0] + 4}" cy="${R1[1] + 6}" r="16" fill="${skin}"/>`;
  return `<g transform="translate(${o.x} ${o.y}) scale(${o.sc * (o.flip ? -1 : 1)} ${o.sc})">${s}</g>`;
}

function arjun(o) {
  const hood = '#D9952A', skin = SKIN_A;
  let s = '';
  s += `<path d="M-74 -224 Q-92 -120 -84 0 L84 0 Q92 -120 74 -224 Q40 -252 0 -252 Q-40 -252 -74 -224Z" fill="${hood}"/>`;
  s += `<path d="M-46 -246 Q0 -206 46 -246 Q40 -228 0 -214 Q-40 -228 -46 -246Z" fill="#B87A1C"/>`;
  s += `<path d="M-14 -220 L-18 -160 M14 -220 L18 -160" stroke="#F3E3C6" stroke-width="5" stroke-linecap="round"/>`;
  s += `<rect x="-52" y="-120" width="104" height="54" rx="12" fill="#C5841F"/>`;
  s += `<rect x="-18" y="-282" width="36" height="40" fill="${skin}"/>`;
  s += `<path d="M-50 -262 Q-56 -238 -40 -228 M50 -262 Q56 -238 40 -228" stroke="#2C2F36" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M-50 -236 Q0 -214 50 -236" stroke="#2C2F36" stroke-width="7" fill="none"/>`;
  const L1 = o.armL || [-100, -30], R1 = o.armR || [100, -30];
  s += arm(-66, -218, L1[0], L1[1], o.bendL ?? -1, hood, skin);
  s += arm(66, -218, R1[0], R1[1], o.bendR ?? 1, hood, skin);
  if (o.cup) s += `<g transform="translate(${R1[0]} ${R1[1] - 14})"><path d="M-18 -26 L18 -26 L14 20 L-14 20Z" fill="#fff"/><rect x="-16" y="-10" width="32" height="12" fill="#7A4B2A"/></g>`;
  s += `<g transform="translate(${o.hx || 0} ${-338 + (o.hy || 0)}) rotate(${o.tilt || 0})">${head({ ...o.face, kind: 'arjun', skin, glasses: true })}</g>`;
  if (o.phoneL) s += `<rect x="${L1[0] - 14}" y="${L1[1] - 30}" width="28" height="54" rx="7" fill="#1b1f26" transform="rotate(10 ${L1[0]} ${L1[1]})"/><circle cx="${L1[0] - 4}" cy="${L1[1] + 6}" r="16" fill="${skin}"/>`;
  return `<g transform="translate(${o.x} ${o.y}) scale(${o.sc * (o.flip ? -1 : 1)} ${o.sc})">${s}</g>`;
}

// talking gesture for whoever speaks
const talk = (who, t) => speaking(who, t) ? env(who, t) : 0;
const sway = (t, f = 1) => Math.sin(t * 2.3 * f);

// ---------- props ----------
function clock(x, y, r, hh, mm, dark) {
  const a = mm / 60 * 360, b = (hh % 12 + mm / 60) / 12 * 360;
  return `<g transform="translate(${x} ${y})"><circle r="${r}" fill="${dark ? '#2B3346' : '#fff'}" stroke="#3B3530" stroke-width="7"/>` +
    [...Array(12)].map((_, i) => `<path d="M0 ${-r + 9} V${-r + 17}" stroke="${dark ? '#9aa6bf' : '#3B3530'}" stroke-width="4" transform="rotate(${i * 30})"/>`).join('') +
    `<path d="M0 0 V${-r * 0.5}" stroke="${dark ? '#e8ecf3' : '#3B3530'}" stroke-width="7" stroke-linecap="round" transform="rotate(${b})"/>` +
    `<path d="M0 0 V${-r * 0.78}" stroke="${dark ? '#e8ecf3' : '#3B3530'}" stroke-width="4.5" stroke-linecap="round" transform="rotate(${a})"/><circle r="5" fill="#B23A33"/></g>`;
}
function trolley(x, y, sc = 1, handle = 1) {
  return `<g transform="translate(${x} ${y}) scale(${sc})"><path d="M-22 -150 V${-150 - 70 * handle} H22 V-150" fill="none" stroke="#5E6470" stroke-width="7"/>` +
    `<rect x="-58" y="-150" width="116" height="150" rx="16" fill="#2F6F8F"/><path d="M-30 -140 V-10 M0 -140 V-10 M30 -140 V-10" stroke="#285E79" stroke-width="5"/>` +
    `<rect x="-44" y="-112" width="40" height="26" rx="4" fill="#F3D35B" transform="rotate(-8 -24 -99)"/><text x="-24" y="-94" font-size="13" font-weight="800" text-anchor="middle" fill="#7a5a00" transform="rotate(-8 -24 -99)">GOI</text>` +
    `<circle cx="-38" cy="6" r="9" fill="#222"/><circle cx="38" cy="6" r="9" fill="#222"/></g>`;
}
// website shown on monitors; k = 0 normal, button colour shift c (0..1), form gone g (0..1)
function site(w, h, c, g, users) {
  const btn = c > 0 ? `rgb(${lerp(47, 48, c)},${lerp(107, 108, c)},${lerp(255, 255, c)})` : 'rgb(47,107,255)';
  const cw = w * 0.42, ch = h * 0.62, cx = (w - cw) / 2, cy = h * 0.22;
  let s = `<rect width="${w}" height="${h}" fill="#F6F8FC"/><rect width="${w}" height="${h * 0.12}" fill="#13203A"/>` +
    `<text x="${w * 0.04}" y="${h * 0.083}" font-size="${h * 0.052}" font-weight="800" fill="#fff">ShopKart</text>`;
  s += `<g opacity="${1 - g}"><rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="${h * 0.03}" fill="#fff" stroke="#DDE3EE" stroke-width="2"/>` +
    `<text x="${w / 2}" y="${cy + ch * 0.17}" font-size="${h * 0.05}" font-weight="800" text-anchor="middle" fill="#13203A">Sign in</text>` +
    `<rect x="${cx + cw * 0.1}" y="${cy + ch * 0.27}" width="${cw * 0.8}" height="${ch * 0.13}" rx="6" fill="#EEF2F8"/>` +
    `<rect x="${cx + cw * 0.1}" y="${cy + ch * 0.46}" width="${cw * 0.8}" height="${ch * 0.13}" rx="6" fill="#EEF2F8"/></g>`;
  if (g > 0) s += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="${h * 0.03}" fill="none" stroke="#C9D2E1" stroke-width="2" stroke-dasharray="10 8" opacity="${g * 0.7}"/>`;
  const by = lerp(cy + ch * 0.68, cy + ch * 0.68, g);
  s += `<rect x="${cx + cw * 0.1}" y="${by}" width="${cw * 0.8}" height="${ch * 0.15}" rx="8" fill="${btn}"/>` +
    `<text x="${w / 2}" y="${by + ch * 0.1}" font-size="${h * 0.042}" font-weight="800" text-anchor="middle" fill="#fff">Login</text>`;
  if (users !== undefined) s += `<text x="${w * 0.96}" y="${h * 0.08}" font-size="${h * 0.04}" font-weight="700" text-anchor="end" fill="#9FB0CC">Users online: ${users}</text>`;
  return s;
}

// ---------- scene timings ----------
const A_END = E(6, 1.1), B_END = S(13, -0.7), T_END = W.total;

function sceneA(t) {
  const dusk = ramp(t, 0, A_END);
  let s = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${dusk > .5 ? '#5B5A8C' : '#F2A65A'}"/><stop offset="1" stop-color="#F7C987"/></linearGradient></defs>`;
  s += `<rect width="1920" height="1080" fill="#E9E1D3"/><rect y="830" width="1920" height="250" fill="#B59F84"/><rect y="822" width="1920" height="14" fill="#9C876D"/>`;
  // window
  s += `<rect x="1290" y="120" width="500" height="420" rx="8" fill="url(#sky)" stroke="#CFC4B2" stroke-width="16"/>` +
    `<path d="M1300 540 V420 H1350 V380 H1400 V440 H1440 V350 H1500 V460 H1550 V400 H1600 V470 H1650 V390 H1700 V450 H1780 V540Z" fill="#6F5D7A" opacity=".75"/>` +
    `<path d="M1540 120 V540 M1290 330 H1790" stroke="#CFC4B2" stroke-width="10"/>`;
  // wall bits
  const mins = 52 + t / 9;
  s += clock(980, 190, 62, 5, mins);
  s += `<g transform="translate(700 120)"><rect width="150" height="170" rx="8" fill="#fff" stroke="#D5CCBC" stroke-width="4"/><rect width="150" height="46" rx="8" fill="#C0392B"/><text x="75" y="33" font-size="28" font-weight="800" text-anchor="middle" fill="#fff">FRI</text><text x="75" y="140" font-size="78" font-weight="800" text-anchor="middle" fill="#2a2a2a">13</text></g>`;
  s += `<g transform="translate(400 150)"><rect width="200" height="140" fill="#2B3A55"/><text x="100" y="62" font-size="30" font-weight="800" text-anchor="middle" fill="#F3D35B">MOVE</text><text x="100" y="102" font-size="30" font-weight="800" text-anchor="middle" fill="#F3D35B">FAST</text></g>`;
  // door
  s += `<rect x="60" y="300" width="250" height="530" fill="#8C6A4B"/><rect x="78" y="318" width="214" height="512" fill="#A47E5B"/><circle cx="270" cy="580" r="11" fill="#E0C27A"/><text x="185" y="380" font-size="22" font-weight="700" text-anchor="middle" fill="#F1E3CC">EXIT</text>`;
  // trolley waits by the door from the very first frame
  const exitK = ramp(t, E(6, -0.25), E(6, 1.05));
  const mx = lerp(620, -260, exitK);
  if (exitK < 0.08) s += trolley(360, 838, 1, 0);
  // desk + monitor
  s += `<rect x="900" y="636" width="640" height="26" rx="6" fill="#7B5A3F"/><rect x="920" y="662" width="600" height="170" fill="#6A4C34"/>`;
  s += `<rect x="1060" y="400" width="340" height="222" rx="12" fill="#1F232B"/><g transform="translate(1074 414)">${site(312, 194, 0, 0)}</g>`;
  s += `<rect x="1210" y="622" width="40" height="18" fill="#1F232B"/><rect x="1170" y="632" width="120" height="8" rx="4" fill="#1F232B"/>`;
  s += `<g transform="rotate(4 1372 420)"><rect x="1346" y="392" width="62" height="56" fill="#F7E07A"/><text x="1377" y="418" font-size="13" font-weight="800" text-anchor="middle" fill="#6a5300">"5 min"</text><text x="1377" y="436" font-size="11" font-weight="700" text-anchor="middle" fill="#6a5300">— Aug</text></g>`;
  s += `<rect x="1000" y="600" width="44" height="34" rx="5" fill="#fff"/><rect x="1004" y="606" width="36" height="9" fill="#7A4B2A"/>`;
  // Arjun at the desk, to the right of the monitor
  const aTalk = talk('arjun', t), ab = blinkAt(t, 1.3);
  const lookM = speaking('manager', t) || (t < E(6) && t > S(0, 0.3)) ? -1 : -0.2;
  const slowBlink = t > S(2) && t < E(2) ? clamp(Math.sin((t - S(2)) / (E(2) - S(2)) * Math.PI) * 1.2) : 0;
  const atBag = t > S(6, 2.3) && t < E(6, 0.4);
  const sigh = ramp(t, E(6, 0.6), E(6, 1.0));
  s += `<rect x="1560" y="560" width="230" height="250" rx="30" fill="#3A3F4A"/>`;
  s += arjun({ x: 1680, y: 760 + sigh * 6, sc: 0.95, armL: [1490 - 1680 + 140 + aTalk * 30, -110 - aTalk * 40], armR: [80, -40],
    face: { mouth: aTalk, blink: Math.max(ab, slowBlink), lx: atBag ? -1 : lookM, ly: atBag ? 1 : 0, worry: t > S(3) && t < E(4) ? 0.6 : 0, lid: t > S(3) && t < E(3) ? 0.35 : 0 },
    tilt: speaking('arjun', t) ? sway(t) * 2 : -4 });
  s += `<rect x="1500" y="636" width="320" height="26" rx="6" fill="#7B5A3F"/>`;
  // Manager
  const mTalk = talk('manager', t), mb = blinkAt(t, 2.9), walking = exitK > 0 && exitK < 1;
  const watch = t > S(6, 1.6) && t < E(6, -0.3);
  const pts = mTalk > 0.1 ? [-90 + mTalk * 10, -110 - mTalk * 30] : [-80, -60];
  s += manager({ x: mx, y: 590 + (walking ? Math.abs(Math.sin(t * 9)) * -8 : 0), sc: 0.92, legs: true, walk: walking ? t * 9 : 0, flip: walking,
    armL: watch ? [-10, -230] : [-96, -96], mug: !walking && !watch, behindL: false,
    armR: walking ? [120, -10] : (mTalk > 0.08 ? [150 + sway(t, 1.6) * 25, -170 - mTalk * 60] : [104, -20]),
    face: { mouth: mTalk, blink: mb, lx: watch ? -0.3 : 1, ly: watch ? 1 : 0, worry: watch ? 0.3 : 0, frown: S(5) < t && t < E(5) ? 0.7 : 0 },
    tilt: watch ? 8 : (mTalk > 0.08 ? sway(t) * 3 : 0), hy: 0 });
  if (exitK >= 0.08) s += trolley(mx - 260, 838, 1, 1);
  return s;
}

function sceneB(t) {
  let s = `<rect width="1920" height="1080" fill="#2C3243"/><rect y="880" width="1920" height="200" fill="#5D4A3A"/>`;
  s += `<rect x="640" y="80" width="1200" height="740" rx="26" fill="#14171d"/><rect x="668" y="108" width="1144" height="684" rx="8" fill="#0F1622"/>`;
  const sx = 668, sy = 108, sw = 1144, sh = 684;
  const t0 = S(7, -0.6);
  const prog = ramp(t, S(7, 0), S(8, 0));
  if (t < S(11, -0.1)) {
    s += `<g font-family="'Liberation Mono',monospace" font-size="30" fill="#CFE3FF">`;
    s += `<text x="${sx + 50}" y="${sy + 70}" font-size="38" font-weight="700" fill="#fff">Deploying to production…</text>`;
    s += `<rect x="${sx + 50}" y="${sy + 100}" width="1040" height="26" rx="13" fill="#24324A"/><rect x="${sx + 50}" y="${sy + 100}" width="${1040 * prog}" height="26" rx="13" fill="#3DD68C"/>`;
    s += `<text x="${sx + 1090}" y="${sy + 164}" text-anchor="end" fill="#8EA3C2">${Math.round(prog * 100)}%</text>`;
    const tests = ['checkout_flow', 'cart_update', 'search_results', 'payment_gateway', 'order_history', 'wishlist_sync', 'coupon_apply'];
    tests.forEach((n, i) => {
      const k = ramp(t, S(8, -0.9 + i * 0.22), S(8, -0.75 + i * 0.22));
      if (k > 0) s += `<text x="${sx + 50}" y="${sy + 230 + i * 50}" opacity="${k}"><tspan fill="#3DD68C">✔</tspan>  ${n}</text>`;
    });
    const fail = ramp(t, S(8, 1.55), S(8, 1.8));
    if (ramp(t, S(8, 0.9), S(8, 1.1)) > 0) s += `<text x="${sx + 50}" y="${sy + 580}" fill="#8EA3C2" opacity="${ramp(t, S(8, 0.9), S(8, 1.1))}">… 46 passed</text>`;
    if (fail > 0) s += `<text x="${sx + 50}" y="${sy + 636}" opacity="${fail}"><tspan fill="#FF5C5C">✖</tspan>  <tspan fill="#FF8A8A">login_page</tspan></text>`;
    s += `</g>`;
  } else {
    s += `<g transform="translate(${sx} ${sy})">${site(sw, sh, ramp(t, S(12, 0.2), S(12, 1.0)), ramp(t, S(12, 1.9), S(12, 2.8)))}</g>`;
  }
  // Manager leans in from the left with the trolley handle in hand
  const inK = ramp(t, S(9, -0.35), S(9, 0.05)) * (1 - ramp(t, E(12, -0.6), E(12, 0.2)));
  if (inK > 0) {
    const mTalk = talk('manager', t);
    s += manager({ x: lerp(-260, 90, inK), y: 900, sc: 1.2, armL: [-140, 40], armR: [120, 40],
      face: { mouth: mTalk, blink: blinkAt(t, 7), lx: 1, ly: -0.1, worry: 0.8 }, tilt: 10 });
  }
  // Arjun close-up, bottom left, looking at the screen
  const aTalk = talk('arjun', t);
  s += arjun({ x: 330, y: 1260, sc: 1.75, armL: [-120, 40], armR: [130, 40],
    face: { mouth: aTalk, blink: blinkAt(t, 4.2), lx: 1, ly: -0.2, lid: t > S(12, 1.9) ? 0.4 : 0.15 }, tilt: 3 });
  return s;
}

function sceneC(t) {
  let s = '';
  // left: airport lounge
  s += `<svg x="0" y="0" width="952" height="1080" viewBox="0 0 952 1080">`;
  s += `<rect width="952" height="1080" fill="#DCE8F2"/><rect x="40" y="120" width="880" height="520" fill="#9FD0F0" stroke="#B9C9D6" stroke-width="18"/>` +
    `<path d="M40 560 H920 V640 H40Z" fill="#BFC6CC"/><g transform="translate(${560 + (t - B_END) * 6} 420)"><path d="M-260 30 Q-40 0 220 22 Q260 30 220 40 Q-40 60 -260 44Z" fill="#fff"/><path d="M-210 30 L-250 -40 L-220 -40 L-160 30Z" fill="#E64A3B"/><path d="M-20 40 L60 110 L90 110 L40 40Z" fill="#e9eef3"/></g>` +
    `<path d="M300 120 V640 M620 120 V640" stroke="#B9C9D6" stroke-width="12"/>`;
  const flip = ramp(t, E(19, 0.3), E(19, 0.6));
  s += `<g transform="translate(64 150)"><rect width="390" height="120" rx="8" fill="#1E2229"/><text x="22" y="48" font-size="30" font-weight="800" fill="#F5B83D" font-family="'Liberation Mono',monospace">6E 512  GOA</text><text x="22" y="94" font-size="28" font-weight="800" fill="${flip > 0.5 ? '#3DD68C' : '#F5B83D'}" font-family="'Liberation Mono',monospace">${flip > 0.5 ? 'BOARDING' : 'DELAYED'}</text></g>`;
  s += `<rect y="880" width="952" height="200" fill="#8E9AA6"/><rect x="200" y="640" width="560" height="300" rx="40" fill="#3D5A80"/>`;
  const mTalk = talk('manager', t), oreyK = ramp(t, S(16, -0.1), S(16, 0.2));
  const shadesOn = ramp(t, E(19, 1.4), E(19, 2.0));
  const lower = ramp(t, E(19, 0.6), E(19, 1.3));
  s += manager({ x: 480, y: 900, sc: 1.05,
    armR: [lerp(84, 120, lower), lerp(-352, -120, lower)], phone: true, bendR: 1,
    armL: shadesOn > 0 && shadesOn < 1 ? [-20, -440] : [lerp(-150, -120, oreyK), lerp(-80, -30, oreyK)], juice: !(shadesOn > 0 && shadesOn < 1),
    face: { mouth: mTalk, blink: blinkAt(t, 3.3), lx: 0.6, ly: 0, worry: oreyK * (t < S(18) ? 1 : 0.6) + ramp(t, E(19, 0), E(19, 0.4)) * 0.4, shades: shadesOn < 0.5, shadesOn: shadesOn >= 0.5, smile: oreyK < 0.5 ? 1 : 0 },
    tilt: lerp(-6, 0, oreyK) });
  s += `</svg>`;
  // right: office, evening
  s += `<svg x="968" y="0" width="952" height="1080" viewBox="0 0 952 1080">`;
  s += `<rect width="952" height="1080" fill="#1E2638"/><rect x="560" y="110" width="320" height="300" fill="#0E1424" stroke="#2D3850" stroke-width="12"/>` +
    [...Array(14)].map((_, i) => `<rect x="${580 + (i * 53) % 280}" y="${150 + Math.floor(i / 5) * 80}" width="18" height="24" fill="#F7D774" opacity="${0.35 + (i % 3) * 0.2}"/>`).join('');
  s += clock(420, 170, 54, 7, 40 + (t - B_END) / 8, true);
  s += `<ellipse cx="200" cy="610" rx="240" ry="170" fill="#F7D774" opacity=".08"/>`;
  s += `<rect x="40" y="420" width="470" height="300" rx="14" fill="#14171d"/><g transform="translate(56 436)">${site(438, 268, 1, 1, 0)}</g>`;
  const aTalk = talk('arjun', t), down = ramp(t, E(19, 1.0), E(19, 1.7));
  s += arjun({ x: 690, y: 1000, sc: 1.05, armL: [lerp(-84, -120, down), lerp(-345, -60, down)], phoneL: true, bendL: -1, armR: [110, -20], cup: true,
    face: { mouth: aTalk, blink: blinkAt(t, 5.7), lx: down > 0.5 ? 0 : -0.5, ly: 0, lid: 0.25 }, tilt: down > 0.5 ? 0 : -5 });
  s += `<rect x="0" y="900" width="952" height="180" fill="#3F3126"/>`;
  s += `</svg>`;
  s += `<rect x="952" y="0" width="16" height="1080" fill="#0b0d12"/>`;
  return s;
}

const svg = document.getElementById('stage'), sub = document.getElementById('sub'), chip = document.getElementById('chip');
const fade = document.getElementById('fade'), card = document.getElementById('card');
function setT(t) {
  svg.innerHTML = t < A_END ? sceneA(t) : t < B_END ? sceneB(t) : sceneC(t);
  // dips to black between scenes
  const dip = c => 1 - clamp(Math.abs(t - c) / 0.28);
  fade.style.opacity = Math.max(dip(A_END), dip(B_END), 1 - clamp(t / 0.5), ramp(t, T_END - 0.6, T_END)).toFixed(3);
  card.style.opacity = (ramp(t, T_END - 2.6, T_END - 2.0)).toFixed(3);
  // place chip
  const ch = t < A_END ? (t < 4.5 ? 'Friday · 5:52 PM' : '') : t < B_END ? (t < A_END + 2.5 ? '6:40 PM' : '') : (t < B_END + 2.6 ? '7:40 PM' : '');
  chip.textContent = ch; chip.style.display = ch ? 'block' : 'none';
  const l = L.find(l => t >= l.start - 0.1 && t <= l.end + 0.35);
  sub.innerHTML = l ? `<span class="pill"><span class="who" style="color:${l.spk === 'manager' ? '#8EC5FF' : '#F5B83D'}">${l.spk === 'manager' ? 'MANAGER' : 'ARJUN'}</span>${l.sub}</span>` : '';
}
setT(0);
document.fonts.ready.then(() => { window.ready = true; });
</script>
